services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-noesis_chunks}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-large-latest}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      - DATABASE_URL=sqlite:///./data/noesis.db
      - UPLOAD_DIR=./data/uploads
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8080,http://localhost
      - DEFAULT_INSTITUTION_ID=${DEFAULT_INSTITUTION_ID:-default}
      - DEFAULT_INSTITUTION_NAME=${DEFAULT_INSTITUTION_NAME:-Institución Demo}
    volumes:
      - backend_data:/app/data
      - hf_cache:/home/app/.cache/huggingface
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  qdrant_data:
  backend_data:
  hf_cache:
