# HOROS — XcodeGen project specification
# Generate with:  cd Horos && xcodegen generate
name: Horos

options:
  bundleIdPrefix: com.horos
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Swift 5 language mode so the project builds with Xcode 15.2 (macOS 13).
    # The code is written for Swift 6; flip to "6.0" once on Xcode 16+.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule

targetTemplates:
  HorosExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SharedCore
        group: SharedCore
    settings:
      base:
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework

targets:
  # ──────────────────────────────────────────────────────────────
  # 1. Main application
  # ──────────────────────────────────────────────────────────────
  Horos:
    type: application
    platform: iOS
    sources:
      - path: Horos
      - path: SharedCore
        group: SharedCore
    settings:
      base:
        PRODUCT_NAME: Horos
        PRODUCT_BUNDLE_IDENTIFIER: com.horos.app
        INFOPLIST_FILE: Horos/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Horos/Resources/Horos.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: DeviceActivityMonitorExtension
      - target: ShieldConfigurationExtension
      - target: ShieldActionExtension
      - target: DeviceActivityReportExtension
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
      - sdk: DeviceActivity.framework

  # ──────────────────────────────────────────────────────────────
  # 2. DeviceActivityMonitor — background scheduler
  # ──────────────────────────────────────────────────────────────
  DeviceActivityMonitorExtension:
    templates: [HorosExtension]
    sources:
      - path: DeviceActivityMonitorExtension
    settings:
      base:
        PRODUCT_NAME: DeviceActivityMonitorExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.horos.app.monitor
        INFOPLIST_FILE: DeviceActivityMonitorExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements

  # ──────────────────────────────────────────────────────────────
  # 3. ShieldConfiguration — custom OLED block screen
  # ──────────────────────────────────────────────────────────────
  ShieldConfigurationExtension:
    templates: [HorosExtension]
    sources:
      - path: ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_NAME: ShieldConfigurationExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.horos.app.shieldconfiguration
        INFOPLIST_FILE: ShieldConfigurationExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements
    dependencies:
      - sdk: ManagedSettingsUI.framework

  # ──────────────────────────────────────────────────────────────
  # 4. ShieldAction — attempt counter & intercept logic
  # ──────────────────────────────────────────────────────────────
  ShieldActionExtension:
    templates: [HorosExtension]
    sources:
      - path: ShieldActionExtension
    settings:
      base:
        PRODUCT_NAME: ShieldActionExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.horos.app.shieldaction
        INFOPLIST_FILE: ShieldActionExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldActionExtension/ShieldActionExtension.entitlements

  # ──────────────────────────────────────────────────────────────
  # 5. DeviceActivityReport — Screen Time analytics sandbox
  # ──────────────────────────────────────────────────────────────
  DeviceActivityReportExtension:
    templates: [HorosExtension]
    sources:
      - path: DeviceActivityReportExtension
    settings:
      base:
        PRODUCT_NAME: DeviceActivityReportExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.horos.app.report
        INFOPLIST_FILE: DeviceActivityReportExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityReportExtension/DeviceActivityReportExtension.entitlements

schemes:
  Horos:
    build:
      targets:
        Horos: all
        DeviceActivityMonitorExtension: all
        ShieldConfigurationExtension: all
        ShieldActionExtension: all
        DeviceActivityReportExtension: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
